<div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <div class="mb-3">
        <div class="d-flex justify-content-between">
            <span>🗃️ DB 행 (추정)</span>
            <strong>{{ db_size }}</strong>
        </div>
        <div class="d-flex justify-content-between">
            <span>🖼️ 이미지 파일</span>
            <strong>{{ image_size }}</strong>
        </div>
        <hr>
        <div class="d-flex justify-content-between fw-bold">
            <span>합계</span>
            <span>{{ total_size }}</span>
        </div>
    </div>

    <h6 class="mt-4">용량 구성 비율</h6>
    {# progress bar 내부의 텍스트 표시 부분을 수정합니다. #}
    <div class="progress" style="height: 25px; font-size: 0.85rem;">
        <div class="progress-bar" role="progressbar" style="width: {{ db_percentage }}%;" aria-valuenow="{{ db_percentage }}" aria-valuemin="0" aria-valuemax="100" title="DB 행: {{ db_percentage|floatformat:2 }}%">
            {{ db_percentage|floatformat:2 }}%
        </div>
        <div class="progress-bar bg-success" role="progressbar" style="width: {{ image_percentage }}%;" aria-valuenow="{{ image_percentage }}" aria-valuemin="0" aria-valuemax="100" title="이미지: {{ image_percentage|floatformat:2 }}%">
            {{ image_percentage|floatformat:2 }}%
        </div>
    </div>
    <div class="d-flex justify-content-start mt-1">
        <div class="me-3"><i class="bi bi-square-fill text-primary"></i> DB 행</div>
        <div><i class="bi bi-square-fill text-success"></i> 이미지</div>
    </div>
    <small class="text-muted d-block mt-3">* DB 행 용량은 필드 타입과 값에 따라 추정된 값이며, 실제 데이터베이스의 저장 방식과는 다를 수 있습니다.</small>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
</div>
