{# action 속성에 올바른 URL을 지정합니다. #}
<form id="tagEditForm" method="post" enctype="multipart/form-data" action="{% url 'core:edit_japanese_work_tag' pk=tag.pk %}">
    <div class="modal-header">
        <h5 class="modal-title" id="editTagModalLabel">태그 편집: {{ tag.name }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        {% csrf_token %}
        
        <div class="alert alert-danger" role="alert" style="display: none;"></div>

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <div class="form-text">{{ field.help_text }}</div>
                {% endif %}
            </div>
        {% endfor %}

        {% if tag.image %}
            <div class="mb-3">
                <p>현재 이미지:</p>
                <img src="{{ tag.image.url }}" alt="{{ tag.name }}" class="img-fluid rounded" style="max-height: 200px;">
            </div>
        {% endif %}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        <button type="submit" class="btn btn-primary">저장하기</button>
    </div>
</form>
