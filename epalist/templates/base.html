<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}내 웹사이트{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
    <style>
        body {
            padding-top: 56px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">내 코딩 프로젝트</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'persons:japanese_actor_list' %}">일본 배우</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'videos:japanese_work_list' %}">일본 작품</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'photos:japanese_photo_list' %}">일본 사진</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'persons:korean_person_list' %}">한국 인물</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'videos:korean_video_list' %}">한국 영상</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'photos:korean_photo_list' %}">한국 사진</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'videos:local_video_list' %}">로컬 영상</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'board:post_list' %}">게시판</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            태그
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                            <li><a class="dropdown-item" href="{% url 'core:japanese_work_tag_list' %}">일본 작품 태그</a></li>
                            <li><a class="dropdown-item" href="{% url 'core:korean_person_tag_list' %}">한국 인물 태그</a></li>
                            <li><a class="dropdown-item" href="{% url 'core:korean_video_theme_list' %}">한국 영상 주제 태그</a></li>
                            <li><a class="dropdown-item" href="{% url 'core:korean_video_tag_list' %}">한국 영상 태그</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // CSRF 토큰을 가져오는 함수 (모든 AJAX POST 요청에 필요)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
